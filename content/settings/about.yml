title:
  ru: О форуме
  en: |-
    About
    the forum
firstParagraph:
  ru: Петербургский международный молодежный форум станет уникальной платформой для обсуждения актуальных вопросов, волнующих молодое поколение, сосредоточит внимание на важнейших темах, касающихся как индивидуальных интересов, так и глобальных вызовов, стоящих перед обществом.
  en: The St. Petersburg International Youth Forum will serve as a unique platform for discussing pressing issues of concern to the younger generation, focusing on key topics that address both individual interests and the global challenges facing society.
secondParagraph:
  ru: Участники смогут обменяться мнениями, представить свои идеи и инициативы, а также наладить полезные контакты с единомышленниками и экспертами в различных областях.
  en: Participants will be able to exchange views, present their ideas and initiatives, and establish valuable connections with like-minded individuals and experts across various fields.
