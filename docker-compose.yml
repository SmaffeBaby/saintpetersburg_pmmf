services:
  saint-mmf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saint-mmf
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_SMTP_HOST: ${SMTP_HOST:-}
      NUXT_SMTP_PORT: ${SMTP_PORT:-465}
      NUXT_SMTP_SECURE: ${SMTP_SECURE:-true}
      NUXT_SMTP_USER: ${SMTP_USER:-}
      NUXT_SMTP_PASS: ${SMTP_PASS:-}
      NUXT_SMTP_FROM: ${SMTP_FROM:-}
      NUXT_PROJECT_REQUEST_NOTIFY_EMAIL: ${PROJECT_REQUEST_NOTIFY_EMAIL:-}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NUXT_ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      NUXT_DATABASE_PATH: /app/data/saint-mmf.sqlite
      NUXT_REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
